    <main>
      <div class="hero container">
        <h1 class="hero_title">Ефективні рішення для вашого бізнесу</h1>
        <button class="hero_button">Замовити послугу</button>
        <div class="hero_form_overlay">
          <div class="hero_form_layout">
            <form class="hero_form">
              <b class="form_text">Залиште свої дані, ми вам передзвонимо</b>

              <label class="form_label"
                >Ім'я
                <svg class="client_name-icon">
                  <use></use>
                </svg>
                <input class="form_input" type="text" name="client-name"
              /></label>

              <label class="form_label"
                >Телефон<input class="form_input" type="tel" name="client-phone"
              /></label>

              <label class="form_label"
                >Пошта<input class="form_input" type="email" name="client-email"
              /></label>

              <label class="form_label"
                >Коментар
                <textarea class="client-comment" name="client-comment"></textarea>
              </label>
              <div>
                <input type="checkbox" id="policy" class="input_policy visually-hidden" />
                <label for="policy" class="label_policy"
                  >Погоджуюся з розсилкою та приймаю &nbsp;
                  <a href="#" class="policy_link">Умови договору</a></label
                >
              </div>

              <button type="submit" class="form_submit_btn">Відппрвити</button>
            </form>
            <button class="form_btn_close">
              <svg class="close_icon">
                <use href="./images/sprites.svg#btn-close"></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
